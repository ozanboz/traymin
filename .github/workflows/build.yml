name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TrayMin.sln

      - name: Test
        run: dotnet test tests/TrayMin.Tests -c Release --no-restore

      - name: Publish NativeAOT
        run: dotnet publish src/TrayMin -c Release

      - name: Stage release files
        shell: pwsh
        run: |
          $publish = "src/TrayMin/bin/Release/net9.0-windows/win-x64/publish"
          $staging = "artifacts/TrayMin-win-x64"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "$publish/traymin.exe" "$staging/TrayMin.exe"
          $hash = (Get-FileHash "$staging/TrayMin.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TrayMin.exe" | Set-Content "$staging/SHA256SUMS.txt" -Encoding ascii

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TrayMin-win-x64
          path: artifacts/TrayMin-win-x64
          if-no-files-found: error
